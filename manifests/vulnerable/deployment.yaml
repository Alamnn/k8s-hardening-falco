apiVersion: v1
kind: Namespace
metadata:
  name: payments-vuln
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api-vuln
  namespace: payments-vuln
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
    spec:
      automountServiceAccountToken: true
      hostPID: true
      hostNetwork: true
      containers:
        - name: payment-api
          image: python:3.12-slim
          command: ["python3", "-m", "http.server", "8080"]
          securityContext:
            privileged: true
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: host-root
              mountPath: /host
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: default-sa-cluster-admin-binding
subjects:
  - kind: ServiceAccount
    name: default
    namespace: payments-vuln
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
